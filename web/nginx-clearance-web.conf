# CLEARANCE — version Web (démo) : bloc nginx à inclure dans le server{} du site
# (M15 lot W, docs/WEB.md §5). Contenu de build/web/ (bash tools/export_web.sh)
# copié dans <racine du site>/play/.
#
# Le build Web utilise les threads (SharedArrayBuffer) : la page DOIT être
# « cross-origin isolated » (COOP + COEP), sinon Godot affiche
# « Cross-Origin Isolation - Check web server configuration ».

location /play/ {
	# Isolation inter-origines (obligatoire avec les threads).
	add_header Cross-Origin-Opener-Policy "same-origin" always;
	add_header Cross-Origin-Embedder-Policy "require-corp" always;
	add_header Cross-Origin-Resource-Policy "same-origin" always;

	# Fichiers .gz précompressés par export_web.sh (gzip -9) ; à défaut, gzip à la volée.
	gzip_static on;
	gzip on;
	gzip_types application/wasm application/octet-stream application/javascript text/html;

	# Le .wasm doit être servi en application/wasm (compilation en flux).
	types {
		text/html html;
		application/javascript js;
		application/wasm wasm;
		application/octet-stream pck;
		image/png png;
		text/plain txt;
	}

	# index.html : toujours revalidé ; le reste change avec la version
	# (pas de hachage dans les noms : revalidation plutôt que cache immuable).
	location = /play/index.html { add_header Cache-Control "no-cache" always;
		add_header Cross-Origin-Opener-Policy "same-origin" always;
		add_header Cross-Origin-Embedder-Policy "require-corp" always; }
	add_header Cache-Control "public, max-age=3600, must-revalidate" always;
}

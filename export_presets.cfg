; --- Web (M15 lot W, D-216, docs/WEB.md) ---------------------------------------
; Démo J1–J5 (custom_features « demo », D-215) ; feature tag « web » (plateforme).
; Rendu : Compatibility / WebGL 2, imposé par la plateforme
; (rendering/renderer/rendering_method.web = gl_compatibility par défaut).
; AVEC threads (variant/thread_support=true) : le mixage audio tourne hors du
; thread principal (0 sous-alimentation mesurée, contre 13 à 93 % sans threads,
; docs/WEB.md §3) ; exige les en-têtes COOP/COEP (web/nginx-clearance-web.conf).
; Exclus en plus : planches des cinématiques (jamais jouées dans la démo,
; chemins chargés à la demande, -12 Mo).
; Build : bash tools/export_web.sh → build/web/ ; test : node tools/smoke_web.js

[preset.4]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features="demo"
export_filter="all_resources"
include_filter="assets/fonts/OFL-*.txt, assets/models/passenger/License_*.txt"
exclude_filter="tests/*, tools/*, addons/gut/*, .gutconfig.json, scenes/passenger/passenger_demo.tscn, scenes/ui/comparison_ui_demo.tscn, scripts/booth/passenger_demo.gd, scripts/ui/comparison_ui_demo.gd, scripts/ui/demo_booth_backdrop.gd, assets/cinematics/bg/*, assets/cinematics/mid/*, assets/cinematics/lit/*"
export_path="build/web/index.html"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2


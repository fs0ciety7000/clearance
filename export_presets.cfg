; Presets d'export CLEARANCE — Godot 4.7.2 (ARCHITECTURE §16, DECISIONS D-069).
; VERSIONNÉ : ce fichier ne contient AUCUN secret (mots de passe, certificats,
; identifiants Apple). Godot range les données sensibles dans
; .godot/export_credentials.cfg (ignoré par git) ; en CI elles passent par les
; variables d'environnement GODOT_* (voir .github/workflows/build.yml).
; Versions : laissées vides => Godot reprend application/config/version de
; project.godot (source unique, D-063).
; Build reproductible : bash tools/export_all.sh


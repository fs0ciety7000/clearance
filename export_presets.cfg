; Presets d'export CLEARANCE — Godot 4.7.2 (ARCHITECTURE §16, DECISIONS D-069).
; VERSIONNÉ : ce fichier ne contient AUCUN secret (mots de passe, certificats,
; identifiants Apple). Godot range les données sensibles dans
; .godot/export_credentials.cfg (ignoré par git) ; en CI elles passent par les
; variables d'environnement GODOT_* (voir .github/workflows/build.yml).
; Versions : laissées vides => Godot reprend application/config/version de
; project.godot (source unique, D-063).
; Build reproductible : bash tools/export_all.sh

[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="assets/fonts/OFL-*.txt, assets/models/passenger/License_*.txt"
exclude_filter="tests/*, tools/*, addons/gut/*, .gutconfig.json, scenes/passenger/passenger_demo.tscn, scenes/ui/comparison_ui_demo.tscn, scripts/booth/passenger_demo.gd, scripts/ui/comparison_ui_demo.gd, scripts/ui/demo_booth_backdrop.gd"
export_path="build/windows/CLEARANCE.exe"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
codesign/enable=false
application/modify_resources=true
application/icon="res://assets/icons/icon.ico"
application/console_wrapper_icon="res://assets/icons/icon.ico"
application/icon_interpolation=4
application/file_version=""
application/product_version=""
application/company_name="Studio CLEARANCE"
application/product_name="CLEARANCE"
application/file_description="CLEARANCE"
application/copyright="© 2026 Studio CLEARANCE"
application/trademarks=""
application/export_angle=0
application/export_d3d12=0


# Build & release CLEARANCE (ARCHITECTURE §16.7, DECISIONS D-069…D-072).
# Déclenché UNIQUEMENT à la main (Actions > Build > Run workflow) ou par un tag v*
# (ex. git tag v0.8.0 && git push origin v0.8.0) — jamais à chaque push.
# Aucun secret requis : signature macOS ad hoc, Windows non signé.
# Jobs : build (Linux : tests, archives, démo, Web, installateur NSIS, AppImage)
#        → macos-dmg (runner macOS : .dmg depuis l'archive macOS du job build)
#        → release (sur tag v* : Release GitHub, toutes les sorties + SHA256SUMS).
name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  GODOT_VERSION: "4.7.2-stable"   # figée (D-003) ; modèles d'export identiques

jobs:
  build:
    name: Tests GUT + exports Windows / macOS / Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Godot ${{ env.GODOT_VERSION }}
        run: sudo bash tools/install_godot.sh

      - name: Cache des modèles d'export
        id: templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/4.7.2.stable
          key: godot-export-templates-${{ env.GODOT_VERSION }}

      - name: Modèles d'export ${{ env.GODOT_VERSION }}
        if: steps.templates.outputs.cache-hit != 'true'
        run: bash tools/install_godot.sh --templates-only

      - name: Version du tag = version du projet
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(sed -n 's/^config\/version="\(.*\)"$/\1/p' project.godot)"
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME ≠ project.godot v$version"; exit 1; }

      - name: Import du projet
        run: godot --headless --import

      - name: Suite GUT
        run: godot --headless -s addons/gut/gut_cmdln.gd -gconfig=.gutconfig.json -gexit

      # --- Emplacements pour une future signature (secrets GitHub, jamais dans le dépôt) ---
      # Les noms GODOT_* sont lus par l'exportateur et remplacent les champs vides de
      # export_presets.cfg (à vérifier dans la doc 4.7 avant activation). Il faudra aussi
      # passer codesign/codesign à 3 (rcodesign) ou faire signer sur un runner macOS,
      # et notarization/notarization à 2 (rcodesign) dans le preset macOS.
      # - name: Certificats de signature
      #   run: |
      #     echo "${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}" | base64 -d > "$RUNNER_TEMP/macos.p12"
      #     echo "${{ secrets.MACOS_NOTARY_API_KEY_P8_BASE64 }}" | base64 -d > "$RUNNER_TEMP/notary.p8"
      #     echo "${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}" | base64 -d > "$RUNNER_TEMP/windows.pfx"

      - name: Exports release + archives
        run: bash tools/export_all.sh
        # env:
        #   GODOT_MACOS_CODESIGN_CERTIFICATE_FILE: ${{ runner.temp }}/macos.p12
        #   GODOT_MACOS_CODESIGN_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        #   GODOT_MACOS_NOTARIZATION_API_UUID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        #   GODOT_MACOS_NOTARIZATION_API_KEY: ${{ runner.temp }}/notary.p8
        #   GODOT_MACOS_NOTARIZATION_API_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
        #   GODOT_WINDOWS_CODESIGN_IDENTITY: ${{ runner.temp }}/windows.pfx   # + osslsigncode installé
        #   GODOT_WINDOWS_CODESIGN_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

      - name: Smoke test des exports Linux
        run: bash tools/smoke_export.sh

      - name: Exports de la démo (J1–J5) + archives
        run: bash tools/export_all.sh --demo

      - name: Export Web de la démo (D-216, D-220)
        run: bash tools/export_web.sh

      # --- Installateurs (ARCHITECTURE §16.9) -------------------------------------------
      - name: Outils d'installateurs (NSIS, validateurs .desktop / AppStream)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends nsis desktop-file-utils appstream

      - name: Installateurs Windows (NSIS) — jeu et démo
        run: |
          bash tools/package_windows.sh
          bash tools/package_windows.sh --demo

      - name: AppImage Linux — jeu et démo
        run: |
          bash tools/package_linux_appimage.sh
          bash tools/package_linux_appimage.sh --demo

      - name: Artefacts
        uses: actions/upload-artifact@v4
        with:
          name: CLEARANCE-run${{ github.run_number }}
          path: |
            build/dist/CLEARANCE-*
            build/dist/SHA256SUMS*
          if-no-files-found: error
          retention-days: 30

      - name: Archives macOS pour le job macos-dmg
        uses: actions/upload-artifact@v4
        with:
          name: macos-zips-${{ github.run_number }}
          path: build/dist/CLEARANCE-*-macos.zip
          if-no-files-found: error
          retention-days: 1

  macos-dmg:
    name: Images disque macOS (.dmg)
    needs: build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Archives macOS du job build
        uses: actions/download-artifact@v4
        with:
          name: macos-zips-${{ github.run_number }}
          path: build/dist

      - name: create-dmg (fond et disposition ; repli hdiutil sinon)
        run: |
          brew install create-dmg || echo "::warning::create-dmg indisponible, DMG sans mise en page"

      - name: DMG — jeu et démo
        run: |
          bash tools/package_macos_dmg.sh
          bash tools/package_macos_dmg.sh --demo

      - name: Artefacts
        uses: actions/upload-artifact@v4
        with:
          name: CLEARANCE-run${{ github.run_number }}-dmg
          path: build/dist/CLEARANCE-*.dmg
          if-no-files-found: error
          retention-days: 30

  release:
    name: Release GitHub (tag v*)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, macos-dmg]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write   # publication de la Release (gh release)
    steps:
      - name: Artefacts des jobs build et macos-dmg
        uses: actions/download-artifact@v4
        with:
          pattern: CLEARANCE-run${{ github.run_number }}*
          path: dist
          merge-multiple: true

      - name: Empreintes des installateurs
        working-directory: dist
        run: |
          ls -l
          sha256sum CLEARANCE-Setup-*.exe CLEARANCE-Demo-Setup-*.exe CLEARANCE-*.AppImage CLEARANCE-*.dmg > SHA256SUMS-installers
          cat SHA256SUMS-installers

      - name: Release GitHub
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" CLEARANCE-* SHA256SUMS* \
            --title "CLEARANCE $GITHUB_REF_NAME" $( [[ "$GITHUB_REF_NAME" == v0.* ]] && echo --prerelease ) \
            --notes "Installateurs : Windows \`CLEARANCE-Setup-*.exe\` (assistant FR/EN, par utilisateur, sans droits administrateur ; non signé : SmartScreen › Informations complémentaires › Exécuter quand même), macOS \`CLEARANCE-*.dmg\` (universel, signé ad hoc, non notarisé : clic droit › Ouvrir), Linux \`CLEARANCE-*-x86_64.AppImage\` (chmod +x puis lancer) ; Arch / Garuda : paquet AUR clearance-bin. Archives : Windows (x86_64), macOS, Linux x86_64 / Steam Deck (\`.tar.gz\` avec install.sh). Démo J1–J5 : mêmes formats (\`CLEARANCE-Demo-*\`, archives \`-demo-\`) et version Web de la démo (\`-web.zip\`, à servir avec les en-têtes COOP/COEP de web/nginx-clearance-web.conf). Empreintes : SHA256SUMS*. Voir README › Builds."
